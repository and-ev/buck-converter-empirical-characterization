name: Reproduce analysis

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python analysis/analyze.py
      - run: python analysis/build_manifest.py
      - name: Verify deterministic data products
        run: git diff --exit-code -- data/processed data/source_manifest.json
      - name: Verify plots were rendered
        run: test -s plots/results_dashboard.png && test -s plots/electrical_stability.png && test -s plots/measurement_consistency.png && test -s plots/thermal_response.png
